<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__logo" href="/">
      <img src="/static/img/logo.svg" alt="" width="28" height="28" class="site-header__logo-icon">
      <span>Kararsızım</span>
    </a>
    <nav class="site-header__nav" aria-label="Ana menü">
      {% if user.is_authenticated %}
        <a href="{% url 'polls:profile' user.username %}" class="site-header__user">@{{ user.username }}</a>
        <a class="btn btn--primary" href="{% url 'polls:create' %}">Anket oluştur</a>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn--secondary">Çıkış yap</button>
        </form>
      {% else %}
        <a class="btn btn--secondary" href="{% url 'accounts:login' %}">Giriş yap</a>
        <a class="btn btn--primary" href="{% url 'accounts:register' %}">Kayıt ol</a>
      {% endif %}
    </nav>
  </div>
</header>
