{% extends "base.html" %}

{% block title %}Kayıt ol — Kararsızım{% endblock %}

{% block content %}
  <section class="card card--narrow">
    <h1>Kayıt ol</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
        {% include "partials/form_field.html" %}
      {% endfor %}
      <button type="submit" class="btn btn--primary btn--block">Kayıt ol</button>
    </form>
    <p class="card__footer">Zaten hesabın var mı? <a href="{% url 'accounts:login' %}">Giriş yap</a></p>
  </section>
{% endblock %}
